plugins {
	id "com.crystaelix.loom" version "1.17-SNAPSHOT"
	id "eclipse"
	id "idea"
	id "maven-publish"
	id "com.crystaelix.blossom" version "1.3.2"
	id "me.modmuss50.mod-publish-plugin" version "2.2.0"
}

repositories {
	mavenCentral()
	flatDir {
		dirs "libs"
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.parchmentmc.net/"
			}
		}
		filter {
			includeGroup "org.parchmentmc.data"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.nucleoid.xyz/"
			}
		}
		filter {
			includeGroup "eu.pb4"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.terraformersmc.com/"
			}
		}
		filter {
			includeGroup "com.terraformersmc"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.blamejared.com/"
			}
		}
		filter {
			includeGroup "mezz.jei"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.crystaelix.com/releases/"
			}
		}
		filter {
			includeGroup "thelm.jeidrawables"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.architectury.dev/"
			}
		}
		filter {
			includeGroup "dev.architectury"
			includeGroup "me.shedaniel.cloth"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.modmuss50.me/"
			}
		}
		filter {
			includeGroup "teamreborn"
			includeGroup "RebornCore"
			includeGroup "TechReborn"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://cursemaven.com/"
			}
		}
		filter {
			includeGroup "curse.maven"
		}
	}
}

def mcVersion = "1.19.4"
def modName = "TechRebornJEI"
def modId = "techrebornjei"
def specVersion = "19.4"
def vendor = "thelm"

group = "thelm.techrebornjei"
version = "19.4.9"

def archivesName = modName
base.archivesName = archivesName

sourceSets {
	main
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
		vendor = JvmVendorSpec.AZUL
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
}

loom {
	silentMojangMappingsLicense()
	mixin.defaultRefmapName = "${modId}.refmap.json"
	runs {
		configureEach {
			property "fabric.log.console.level", "debug"
		}
		client {
			programArg "--username=Dev"
		}
		server
	}
}

dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:1.19.4"
	mappings loom.layered {
		officialMojangMappings {
			nameSyntheticMembers = false
		}
		parchment "org.parchmentmc.data:parchment-1.19.4:2023.06.26@zip"
	}
	modImplementation "net.fabricmc:fabric-loader:0.19.3"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.87.2+1.19.4"
	modImplementation "eu.pb4:placeholder-api:2.1.1+1.19.4"
	modImplementation "com.terraformersmc:modmenu:6.3.1"

	// JEI
	modImplementation("mezz.jei:jei-1.19.4-fabric:13.1.0.19") {transitive = false}
	include(modImplementation("thelm.jeidrawables:JEIDrawables-Fabric:19.4.7"))

	// Tech Reborn
	modImplementation "teamreborn:energy:3.0.0"
	modImplementation("TechReborn:TechReborn-1.19:5.7.0") {exclude module: "RoughlyEnoughItems-fabric"}

	// Advanced Reborn
	modImplementation "dev.architectury:architectury-fabric:8.2.91"
	modImplementation "me.shedaniel.cloth:cloth-config-fabric:10.1.135"
	modImplementation "curse.maven:mcpitanlibarch-682213:5107572"
	modImplementation "curse.maven:advancedreborn-543089:4466844"
}

def replacements = [
	"0@VERSION@": version
]

blossom {
	replaceToken(replacements)
}

processResources {
	inputs.properties(replacements)
	filesMatching(["mcmod.info", "META-INF/mods.toml", "META-INF/neoforge.mods.toml", "fabric.mod.json"]) {
		filter {
			it.replace(replacements)
		}
	}
}

def manifestAttributes = [
	"Specification-Title": modName,
	"Specification-Vendor": vendor,
	"Specification-Version": specVersion,
	"Implementation-Title": archivesName,
	"Implementation-Version": version,
	"Implementation-Vendor": vendor
]

jar {
	manifest.attributes(manifestAttributes)
}

sourcesJar {
	manifest.attributes(manifestAttributes)
}

publishing {
	publications {
		register("mavenJava", MavenPublication) {
			artifactId = archivesName
			artifact remapJar
			artifact remapSourcesJar
		}
	}
	repositories {
		if(project.hasProperty("CrystaelixMavenUsername") && project.hasProperty("CrystaelixMavenPassword")) {
			maven {
				name = "CrystaelixMaven"
				url = "https://maven.crystaelix.com/releases/"
				credentials(PasswordCredentials)
			}
		}
	}
}

publishMods {
	file = remapJar.archiveFile
	version = displayName = project.version
	changelog = file("changelog.md").text
	type = STABLE
	modLoaders.add("fabric")
	additionalFiles.from(remapSourcesJar.archiveFile)

	curseforge {
		accessToken = providers.gradleProperty("curseforge.token")
		projectId = "1237141"
		minecraftVersions.add(mcVersion)
		client = true
		requires "jei", "techreborn"
		optional "advancedreborn"
		incompatible "roughly-enough-items-hacks", "extra-mod-integrations"
	}

	modrinth {
		accessToken = providers.gradleProperty("modrinth.token")
		projectId = "FaJv0NSi"
		minecraftVersions.add(mcVersion)
		environment = CLIENT_ONLY
		requires "jei"
		optional "advanced-reborn"
		incompatible "roughly-enough-items-hacks", "extra-mod-integrations"
	}
}
